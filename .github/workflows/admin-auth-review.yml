name: Admin authentication dependency review
on:
  push:
    branches: [admin/phase-3c1-secure-auth]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned npm library and CDN bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hag-auth-review"
          cd "$RUNNER_TEMP/hag-auth-review"
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact --no-fund --no-audit @supabase/supabase-js@2.119.2
          npm audit signatures
          npm audit --omit=dev --audit-level=high
          test -f node_modules/@supabase/supabase-js/dist/umd/supabase.min.js
          curl --fail --silent --show-error --location --max-time 30 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js' -o cdn.js
          cmp node_modules/@supabase/supabase-js/dist/umd/supabase.min.js cdn.js
          printf 'HAG_VERIFIED_SRI=sha384-'
          openssl dgst -sha384 -binary cdn.js | openssl base64 -A
          printf '\n'
