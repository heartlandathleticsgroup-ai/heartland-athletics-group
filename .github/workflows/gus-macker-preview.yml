name: Gus Macker preview screenshots

on:
  push:
    branches:
      - gus-macker-community-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Start local website
        run: |
          python3 -m http.server 8000 >/tmp/hag-preview.log 2>&1 &
          echo $! >/tmp/hag-preview.pid
          sleep 2

      - name: Capture preview screenshots
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer
          node <<'NODE'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const desktop = await browser.newPage();
            await desktop.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1 });
            await desktop.goto('http://127.0.0.1:8000/gus-macker/', { waitUntil: 'networkidle0' });
            await desktop.screenshot({ path: 'gus-macker-desktop.png', fullPage: true });

            const mobile = await browser.newPage();
            await mobile.setViewport({ width: 390, height: 844, deviceScaleFactor: 2, isMobile: true });
            await mobile.goto('http://127.0.0.1:8000/gus-macker/', { waitUntil: 'networkidle0' });
            await mobile.screenshot({ path: 'gus-macker-mobile.png', fullPage: true });

            await browser.close();
          })();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gus-macker-preview
          path: |
            gus-macker-desktop.png
            gus-macker-mobile.png
          retention-days: 3
