}else{switch(state.tab){case'home':{let sl=slides[state.slide];html+=`<section class="hero"><div class="micro">WELCOME TO H.A.G.</div><h1>Compete. Develop. Inspire.</h1><p class="hint">Local opportunities. Regional impact. Your connection to everything happening through H.A.G.</p><div class="hero-search"><label for="homeSearchInput">Search H.A.G.</label><div class="hero-search-box"><span class="hero-search-icon" aria-hidden="true">⌕</span><input id="homeSearchInput" class="hero-search-input" type="search" autocomplete="off" value="${e(state.homeSearch)}" placeholder="Events, news, programs, names..." aria-controls="homeSearchResults" oninput="updateHomeSearch(this.value)"><button type="button" class="hero-search-clear" onclick="clearHomeSearch()">Clear</button></div><div class="home-search-hints"><button onclick="chooseHomeSearch('Gus Macker')">Gus Macker</button><button onclick="chooseHomeSearch('Enforcers')">Enforcers</button><button onclick="chooseHomeSearch('Camps')">Camps & clinics</button></div></div></section><div id="homeSearchResults" class="home-search-results" role="region" aria-live="polite">${homeResultsMarkup(state.homeSearch)}</div>${demoAlert()}<section class="section">${sect('In the spotlight','<span class="swipehint">Swipe to explore ↔</span>')}<div class="showcase ${sl.tone}" id="showcase" tabindex="0" aria-label="Featured announcement ${state.slide+1} of ${slides.length}"><div class="courtlines"></div><div class="showbody"><span class="pill">${sl.pill}</span><h3>${sl.title}</h3><p class="sub">${sl.date}</p><button class="cta" onclick="activateSlide()">${sl.cta} <span class="arr">→</span></button></div></div><div class="cnav"><div class="cdots">${slides.map((x,i)=>`<button aria-label="Show featured item ${i+1}" class="dot ${i===state.slide?'active':''}" onclick="setSlide(${i})"></button>`).join('')}<span class="progress">${state.slide+1} / ${slides.length}</span></div><div class="switchers"><button class="roundbtn" onclick="setSlide(${(state.slide case'events':html+=intro('Events & experiences','Discover public activities, save dates and explore what is coming up.');html+=`<div class="section">${sect('Upcoming events')}<div class="filterbar">${['All','Scheduled','Planning underway'].map(x=>`<button class="chip ${state.filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div>${events.filter(x=>state.filter==='All'||x.status===state.filter).map(eventCard).join('')}</div>`;break;
case'programs':html+=intro('Programs & opportunities','Creating exceptional athletic experiences across the Heartland.');html+=`<div class="section">${sect('Find your opportunity')}${[['Camps & clinics','Skill development, specialized instruction, and future registration opportunities.','/programs/'],['Heartland Enforcers','Basketball development, competition, leadership, and club standards.','/enforcers/'],['Community experiences','Public athletic initiatives, partnerships and local programming.','/about/']].map((p,i)=>`<article class="card"><span class="badge ${i===1?'gold':''}">${i===0?'DEVELOP':i===1?'COMPETE':'INSPIRE'}</span><h3>${p[0]}</h3><p>${p[1]}</p><button class="cardbtn" onclick="openSite('${p[2]}')">Learn more ↗</button></article>`).join('')}<p class="fine">Online camp and clinic registrations will be added after the secure registration system is connected.</p></div>`;break;
case'news':{let filtered=stories.filter(x=>(state.filter==='All'||x.category===state.filter)&&((x.title+' '+x.deck+' '+x.category).toLowerCase().includes(state.search.toLowerCase())));html+=intro('H.A.G. News','News, event updates, community recognition and public program stories.');html+=`<div class="section"><div class="newslead"><span style="color:#0057ff">${svg('news')}</span><span><strong>Official stories, all in one place</strong><small>${publishedNewsPresent?'Approved public H.A.G. news':'Editorial previews until official news is published.'}</small></span></div><label class="formlabel" for="searchStories">Search H.A.G. News</label><input class="search" id="searchStories" value="${e(state.search)}" oninput="setSearch(this.value)" placeholder="Search stories..." autocomplete="off"><div class="filterbar">${['All','Events','Programs','Community','Enforcers'].map(x=>`<button class="chip ${state.filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div id="newsResults">${filtered.length?filtered.map(storyCard).join(''):'<div class="noresults">No matching stories. Try another category or search term.</div>'}</div><p class="fine">${publishedNewsPresent?'Approved public posts from the H.A.G. News feed.':'Editorial previews only. Official News publishing is not yet active.'}</p></div>`;break;}
case'more':html+=intro('Connect with H.A.G.','Connect with us and customize your experience.');html+=`<div class="section">${sect('Get in touch')}${contactTeaser()}${socialLinks()}${sect('Your experience')}<article class="card"><h3>Notification interests</h3><p>Choose the H.A.G. topics you want to follow.</p><button class="cardbtn" onclick="preferences()">Manage interests <span>→</span></button></article><article class="card"><h3>Saved events & stories</h3><p>${state.savedEvents.size} events saved · ${state.savedStories.size} articles saved in this browser.</p><button class="cardbtn" onclick="savedView()">View saved items <span>→</span></button></article>${sect('About the organization')}<article class="card"><h3>Heartland Athletics Group</h3><p>COMPETE. DEVELOP. INSPIRE. Athletic opportunities centered on competition, development and community.</p><button class="cardbtn" onclick="openSite('/')">Visit official website <span>↗</span></button><button class="cardbtn" onclick="openSite('/partners/')">Partners & recognition <span>↗</span></button><button class="cardbtn" onclick="openSite('/contact/')">Get in touch <span>↗</span></button></article>${sect('Design preview controls')}<article class="card"><h3>Pinned announcement example</h3><p>Toggle a sample homepage notice to see how event updates could be displayed. It is not a real announcement.</p><button class="cardbtn" onclick="toggleAlert()">${state.alert?'Hide':'Show'} sample homepage notice <span>→</span></button></article></div>`;break;
}}

document.getElementById('viewport').innerHTML=html;
document.getElementById('tabs').innerHTML=[['home','Home'],['events','Events'],['programs','Programs'],['news','News'],['more','More']].map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" onclick="go('${t[0]}')" ${state.tab===t[0]?'aria-current="page"':''}>${svg(t[0]==='events'?'calendar':t[0]==='programs'?'trophy':t[0]==='news'?'news':t[0]==='more'?'menu':'home')}<span>${t[1]}</span></button>`).join('');
if(scroll)document.getElementById('viewport').scrollTop=0;
const sh=document.getElementById('showcase');if(sh){let start=null;sh.addEventListener('touchstart',ev=>{start=ev.touches[0].clientX},{passive:true});sh.addEventListener('touchend',ev=>{if(start===null)return;let dx=ev.changedTouches[0].clientX-start;if(Math.abs(dx)>45)setSlide((state.slide+(dx<0?1:slides.length-1))%slides.length);start=null},{passive:true});sh.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')setSlide((state.slide+1)%slides.length);if(ev.key==='ArrowLeft')setSlide((state.slide+slides.length-1)%slides.length);});}

/* Home discovery index: public events, editorial preview stories and program pages.
   Future approved player spotlights can be added as a new searchable type. */
const homePrograms=[
  {id:'camps',title:'Camps & clinics',summary:'Skill development, specialized instruction and future camp registrations.'},
  {id:'enforcers',title:'Heartland Enforcers',summary:'Basketball club programs, public news and development opportunities.'},
  {id:'community',title:'Community experiences',summary:'Public events, partnerships and local athletic activities.'}
];
function homeMatches(query){
  const words=query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length)return [];
  const index=[
    ...events.map(x=>({type:'Event',id:x.id,title:x.title,summary:x.date,body:[x.title,x.date,x.status,x.description,x.location||''].join(' ')})),
    ...stories.map(x=>({type:'News',id:x.id,title:x.title,summary:x.deck,body:[x.title,x.deck,x.category,...x.body].join(' ')})),
    ...homePrograms.map(x=>({type:'Program',id:x.id,title:x.title,summary:x.summary,body:[x.title,x.summary].join(' ')}))
  ];
  return index.filter(item=>words.every(w=>item.body.toLocaleLowerCase().includes(w))).slice(0,12);
}
function homeResultsMarkup(query){
  if(!query.trim())return '';
  const matches=homeMatches(query);
  if(!matches.length)return '<div class="home-result-box"><p class="home-result-status">No matches found</p><div class="home-result-sub">Try an event, program, news topic, or another name. Published athlete spotlights will become searchable when that feature launches.</div></div>';
  return '<p class="home-result-status">'+matches.length+' result'+(matches.length===1?'':'s')+' for “'+e(query)+'”</p>'+
    matches.map(item=>'<div class="home-result-box"><button type="button" class="home-result-action" onclick="openHomeResult(\''+item.type+'\',\''+item.id+'\')"><div class="home-result-meta">'+e(item.type)+'</div><div class="home-result-title">'+e(item.title)+' →</div><div class="home-result-sub">'+e(item.summary)+'</div></button></div>').join('');
}
function updateHomeSearch(value){
  state.homeSearch=value;
  const region=document.getElementById('homeSearchResults');
  if(region)region.innerHTML=homeResultsMarkup(value);
}
function chooseHomeSearch(value){
  const input=document.getElementById('homeSearchInput');
  if(input)input.value=value;
  updateHomeSearch(value);
  input?.focus();
}
function clearHomeSearch(){
  chooseHomeSearch('');
}
function openHomeResult(type,id){
  if(type==='Event')showEvent(id);
  else if(type==='News')showStory(id);
  else go('programs');
}

function go(t){state.tab=t;state.view='';state.filter='All';state.search='';render()}
function back(){state.view='';render()}
function showEvent(id){state.view='event:'+id;render()}
function showStory(id){state.tab='news';state.view='story:'+id;render()}
function preferences(){state.view='preferences';render()}
function contactView(){state.view='contact';render()}
function setSlide(i){state.slide=i;let cur=document.getElementById('viewport').scrollTop;render(false);document.getElementById('viewport').scrollTop=cur}
function activateSlide(){let id=slides[state.slide].id;if(id==='programs')go('programs');else showEvent(id)}
function setFilter(t){state.filter=t;render(false)}
function setSearch(t){state.search=t;let filtered=stories.filter(x=>(state.filter==='All'||x.category===state.filter)&&((x.title+' '+x.deck+' '+x.category).toLowerCase().includes(t.toLowerCase())));document.getElementById('newsResults').innerHTML=filtered.length?filtered.map(storyCard).join(''):'<div class="noresults">No matching stories. Try another category or search term.</div>'}
function toggleTopic(t){state.topics.has(t)?state.topics.delete(t):state.topics.add(t);persist('topics',[...state.topics]);render(false);toast('Interests saved in this browser')}
function saveEvent(t){state.savedEvents.has(t)?state.savedEvents.delete(t):state.savedEvents.add(t);persist('events',[...state.savedEvents]);render(false);toast('Saved events updated')}
function saveStory(t){state.savedStories.has(t)?state.savedStories.delete(t):state.savedStories.add(t);persist('stories',[...state.savedStories]);render(false);toast('Saved stories updated')}
function toggleAlert(){state.alert=!state.alert;persist('alert',state.alert);let y=document.getElementById('viewport').scrollTop;render(false);document.getElementById('viewport').scrollTop=y;toast('Sample announcement '+(state.alert?'enabled':'hidden'))}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function savedView(){state.view='saved';render()}

function calendarIso(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)}
function calendarUrl(x,provider){
  const details=x.description+' Learn more: '+SITE+(x.id==='macker'?'/gus-macker/':'/enforcers/');
  if(provider==='google'){
    const q=new URLSearchParams({action:'TEMPLATE',text:x.title,dates:x.start+'/'+x.end,details:details});
    if(x.location)q.set('location',x.location);
    return 'https://calendar.google.com/calendar/render?'+q.toString();
  }
  if(provider==='outlook'){
    const q=new URLSearchParams({path:'/calendar/action/compose',rru:'addevent',subject:x.title,startdt:calendarIso(x.start),enddt:calendarIso(x.end),allday:'true',body:details});
    if(x.location)q.set('location',x.location);
    return 'https://outlook.live.com/calendar/0/deeplink/compose?'+q.toString();
  }
  return '';
}
function closeCalendar(){
  document.getElementById('calendar-picker')?.remove();
}
function chooseCalendar(id){
  const x=events.find(z=>z.id===id);
  if(!x)return;
  closeCalendar();
  const overlay=document.createElement('div');
  overlay.className='calendar-shade';
  overlay.id='calendar-picker';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Choose calendar');
  overlay.innerHTML='<div class="calendar-panel"><h2>Save to your calendar</h2><p>'+e(x.title)+' · '+e(x.date)+'</p>'+
    '<button class="calendar-choice" data-provider="google">Google Calendar <span>↗</span></button>'+
    '<button class="calendar-choice" data-provider="outlook">Outlook Calendar <span>↗</span></button>'+
    '<button class="calendar-choice" data-provider="apple">Apple Calendar <small>Download .ics file to import</small></button>'+
    '<button class="calendar-cancel" data-provider="cancel">Cancel</button></div>';
  overlay.addEventListener('click',event=>{if(event.target===overlay)closeCalendar()});
  overlay.querySelectorAll('[data-provider]').forEach(btn=>btn.addEventListener('click',()=>{
    const provider=btn.dataset.provider;
    if(provider==='google'||provider==='outlook'){
      const url=calendarUrl(x,provider);
      window.open(url,'_blank','noopener,noreferrer');
      closeCalendar();
    } else if(provider==='apple'){
      closeCalendar();
      calendarEvent(id);
    } else closeCalendar();
  }));
  document.body.appendChild(overlay);
  const closeOnEscape=event=>{if(event.key==='Escape'){closeCalendar();document.removeEventListener('keydown',closeOnEscape)}};
  document.addEventListener('keydown',closeOnEscape,{once:true});
  overlay.querySelector('.calendar-choice')?.focus();
}

function calendarEvent(id){let x=events.find(x=>x.id===id);let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Heartland Athletics Group//Event Preview//EN','BEGIN:VEVENT','UID:'+id+'@heartlandathleticsgroup.com','DTSTAMP:20261015T120000Z','DTSTART;VALUE=DATE:'+x.start,'DTEND;VALUE=DATE:'+x.end,'SUMMARY:'+x.title.replaceAll(',','\\,'),'DESCRIPTION:'+x.description.replaceAll('\n',' ').replaceAll(',','\\,')];if(x.location)lines.push('LOCATION:'+x.location.replaceAll(',','\\,'));lines.push('END:VEVENT','END:VCALENDAR');let blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=id+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Apple Calendar file downloaded. Open it to import the event.')}
async function shareText(t){if(navigator.share){try{await navigator.share({text:t});return}catch{}}try{await navigator.clipboard.writeText(t);toast('Details copied to clipboard')}catch{toast('Sharing unavailable in this browser')}}
function shareEvent(id){let x=events.find(x=>x.id===id);shareText(`${x.title} — ${x.date}. More at ${SITE}${id==='macker'?'/gus-macker/':'/enforcers/'}`)}
function shareStory(id){let s=stories.find(x=>x.id===id);shareText(`H.A.G. app editorial preview: ${s.title} — ${s.deck}. Official website: ${SITE}`)}
function openSite(path){window.open(SITE+path,'_blank','noopener,noreferrer')}

let publishedNewsPresent=false;
async function reloadPublicFeed(){
 const results=await Promise.allSettled(['events','news'].map(async kind=>{
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);
  try{
   const response=await fetch('/app-content/api/v1/'+kind+'.json',{signal:ctrl.signal,cache:'no-store'});
   if(!response.ok)throw Error('Feed unavailable');
   const body=await response.json();
   if(body?.schema_version!==1||body?.kind!==kind||!Array.isArray(body.items))throw Error('Invalid feed format');
   return {kind,items:body.items};
  } finally{clearTimeout(timer)}
 }));
 let changed=false;
 for(const result of results){
  if(result.status!=='fulfilled')continue;
  const {kind,items}=result.value;
  if(kind==='events'){
   const pub=items.filter(x=>x.publication_state==='published'&&typeof x.title==='string'&&
      typeof x.browser_id==='string'&&typeof x.date_label==='string'&&
      typeof x.start_date==='string'&&typeof x.end_date_exclusive==='string'&&
      typeof x.description==='string'&&['Scheduled','Planning underway'].includes(x.status));
   events.splice(0,events.length,...pub.map(x=>({
      id:x.browser_id,title:x.title,date:x.date_label,
      start:x.start_date.replaceAll('-',''),end:x.end_date_exclusive.replaceAll('-',''),
      status:x.status,location:typeof x.location==='string'&&x.location.trim()?x.location:undefined,
      description:x.description
   })));
   changed=true;
  }
  if(kind==='news'){
   const pub=items.filter(x=>x.publication_state==='published'&&typeof x.id==='string'&&
     typeof x.title==='string'&&typeof x.deck==='string'&&Array.isArray(x.body)&&
     x.body.every(p=>typeof p==='string')&&['Events','Programs','Community','Enforcers'].includes(x.category));
   if(pub.length){
    stories.splice(0,stories.length,...pub.map(x=>({
      id:x.id,title:x.title,deck:x.deck,body:x.body,category:x.category,
      art:x.art||'H.A.G.\\nNEWS',tone:['gold','blue','charcoal'].includes(x.tone)?x.tone:'blue',
      link:x.event_id==='gus-macker-quincy-2027'?'macker':
        x.event_id==='bags-buckets-2026'?'bags':undefined,
      published:true
    })));
    publishedNewsPresent=true;changed=true;
   }
  }
 }
 if(changed){const vp=document.getElementById('viewport'),scroll=vp?.scrollTop||0;render(false);if(vp)vp.scrollTop=scroll;}
}

render();
void reloadPublicFeed();
