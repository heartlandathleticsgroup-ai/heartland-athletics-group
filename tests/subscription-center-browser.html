<!doctype html><html lang="en"><meta charset="utf-8"><title>Local preference center browser QA</title><p id="result">RUNNING</p><iframe id="frame" title="Subscriber preference center test" style="width:390px;height:900px;border:0"></iframe><script type="module">
const frame=document.getElementById("frame"),result=document.getElementById("result");
const check=(x,label)=>{if(!x)throw Error(label);};
const wait=async(fn,label)=>{for(let i=0;i<150;i++){if(fn())return;await new Promise(r=>setTimeout(r,20));}throw Error(label+"; status: "+frame.contentDocument?.getElementById("status")?.textContent+"; error: "+frame.contentDocument?.getElementById("error")?.textContent);};
const load=new Promise(r=>frame.addEventListener("load",r,{once:true}));frame.src="/center.html";await load;
const d=frame.contentDocument,$=id=>d.getElementById(id);
const text=(id,s)=>$(id).textContent.includes(s);
const click=async id=>{await wait(()=>!$(id).disabled,"control still busy: "+id);$(id).click();};
const choose=(id,v)=>{const el=$(id);el.value=v;el.dispatchEvent(new frame.contentWindow.Event("change"));};
const setCheck=(el,v)=>{el.checked=v;el.dispatchEvent(new frame.contentWindow.Event("change"));};
const inbox=()=>[...$("inbox").querySelectorAll("button")];
const link=label=>inbox().findLast(x=>x.textContent.includes(label));
const go=async(label,scope=false)=>{await wait(()=>link(label)&&!link(label).disabled,"inbox link missing "+label);link(label).click();check(d.activeElement===$("action-heading"),"action focus");await wait(()=>$("action-controls").querySelector("button")&&!$("action-controls").querySelector("button").disabled,"scope lookup incomplete");if(scope){check($("action-controls").querySelector("li")?.textContent==="General H.A.G. announcements","confirmation scope missing");check($("action-controls").textContent.includes("I agree to receive recurring automated marketing text"),"confirmation consent missing");}$("action-controls").querySelector("button").click();await wait(()=>$("action-panel").hidden,"action not cleared");};
try{
 await wait(()=>!$("start-submit").disabled,"preview initialization");
 check(d.documentElement.lang==="en","language missing");
 check(!d.querySelector("#start input:checked"),"prechecked consent");
 check($("status").getAttribute("role")==="status"&&$("error").getAttribute("role")==="alert","live status missing");
 for(const width of [320,375,390,768,1280]){
  frame.style.width=width+"px";await new Promise(r=>setTimeout(r,50));
  check(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth,"horizontal overflow "+width);
  for(const input of d.querySelectorAll("input,select"))check(input.labels?.length>0,"unlabelled control");
  check($("start-submit").getBoundingClientRect().height>=44,"touch target");
 }
 frame.style.width="390px";
 setCheck($("start-topics").querySelector("input"),true);setCheck($("adult"),true);setCheck($("consent"),true);
 await click("start-submit");await wait(()=>text("status","without a confirmation message"),"email signup failed");check(inbox().length===0,"unexpected signup email");
 choose("channel","sms");setCheck($("start-topics").querySelector("input"),true);setCheck($("adult"),true);setCheck($("consent"),true);
 await click("start-submit");await wait(()=>link("Confirm subscription"),"SMS confirmation missing");
 await go("Confirm subscription",true);await wait(()=>text("status","confirmed"),"confirmation failed");
 await go("Confirm subscription");await wait(()=>text("error","invalid, expired"),"replay not rejected");
 choose("channel","email");
 await click("access");await go("Manage preferences");await wait(()=>!$("manage-panel").hidden,"manage failed");
 check(d.activeElement===$("manage-heading"),"verified focus");
 check(text("manage-detail","Verified email only"),"channel scope");
 check(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth,"manage overflow");
 const add=[...$("edit-topics").querySelectorAll("input")].find(x=>x.value==="camps-clinics");
 setCheck(add,true);check(!$("edit-consent").hidden&&!$("edit-agree").checked,"new consent not fresh");
 await click("save");await wait(()=>text("error","Confirm adult"),"missing consent accepted");
 setCheck($("edit-adult"),true);setCheck($("edit-agree"),true);await click("save");await wait(()=>text("status","saved"),"save failed");
 await click("optout-link");await go("Unsubscribe");await wait(()=>text("status","unsubscribe completed"),"unsubscribe failed");
 await click("access");await wait(()=>!$("access").disabled,"access request still busy");await wait(()=>inbox().filter(x=>x.textContent.includes("Manage preferences")).length>=2,"new access link missing; status: "+$("status").textContent+"; error: "+$("error").textContent);
 await click("expire");await go("Manage preferences");await wait(()=>text("error","invalid, expired"),"expired link accepted");
 choose("channel","sms");check(!$("adult").checked&&!$("consent").checked,"channel consent retained");
 await click("reset");check(inbox().length===0&&$("manage-panel").hidden&&$("action-panel").hidden,"reset failed");
 const admin=document.createElement("iframe");admin.title="Gmail administrative preview";admin.style.cssText="width:320px;height:900px;border:0";document.body.append(admin);
 const al=new Promise(r=>admin.addEventListener("load",r,{once:true}));admin.src="/gmail-admin.html";await al;
 const ad=admin.contentDocument,el=id=>ad.getElementById(id);
 await wait(()=>!el("disable").disabled,"admin preview did not initialize");
 for(const width of [320,390,768,1280]){admin.style.width=width+"px";await new Promise(r=>setTimeout(r,50));check(ad.documentElement.scrollWidth<=admin.contentWindow.innerWidth,"admin overflow "+width);}
 check(el("rotate").disabled,"rotation enabled while sending");
 el("disable").click();await wait(()=>!el("rotate").disabled,"disable did not allow rotation");check(el("status").textContent.includes("Disabled"),"disable status incorrect");
 el("rotate").click();await wait(()=>!el("rotate").disabled,"rotate still busy");
 const close=el("holds").querySelector("button");check(!!close,"held dispatch missing");close.click();await wait(()=>el("holds").textContent.includes("No unresolved dispatches"),"review did not close");
 el("disconnect").click();await wait(()=>el("status").textContent.includes("Disconnected"),"disconnect failed");check(el("disable").disabled&&el("rotate").disabled,"disconnected control active");
 result.textContent="PASS: Gmail administrative preview disable, rotation, no-resend review, disconnect and responsive widths; five viewport widths; labelled controls, focus, touch target, live status, confirmation, replay, verified edit, unsubscribe, expiry and reset";
}catch(e){result.textContent="FAIL: "+e.message;}
</script></html>
